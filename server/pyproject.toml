[project]
name = "papan-server"
version = "0.5.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Recognizer LaTeX samples are kept verbatim, one per line.
"tests/test_chem.py" = ["E501"]
